
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 50M;

    # Health check for Render
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Connect API requests to the Render backend
    location /api {
        proxy_pass https://pricestalker-backend-latest.onrender.com;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name pricestalker-backend-latest.onrender.com;

        proxy_set_header Host pricestalker-backend-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 150s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
    }

    # Debug files
    location /debug_files {
        proxy_pass https://pricestalker-backend-latest.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_name pricestalker-backend-latest.onrender.com;
        proxy_set_header Host pricestalker-backend-latest.onrender.com;
    }

    # Frontend pages
    location / {
        try_files $uri $uri/ /index.html;

        if ($request_uri ~* ^/index\.html$|^/$) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    location ~* ^/(icon\.svg|ghost\.svg|manifest\.json|version\.json|sw\.js|favicon\.ico)$ {
        add_header Cache-Control "public, no-cache, must-revalidate";
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }
}
